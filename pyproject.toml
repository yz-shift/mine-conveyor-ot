[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mine-conveyor-ot"
version = "0.1.0"
description = "Mine conveyor OT simulator and web HMI over Modbus TCP"
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.8,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["shared*", "simulator*", "hmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
